# ===== 前端 Nginx 配置 =====
#
# 为什么需要这个文件？
#   Nginx 官方镜像自带的 default.conf 只服务静态文件（location /），
#   **没有**任何 /api 转发规则。而前端代码里 API_BASE = '/api'（同源请求），
#   所以 Nginx 收到 /api/xxx 时找不到对应文件 → 返回 404。
#
#   表现：页面能打开，但注册/登录全部失败（接口 404）。
#
# 排查手法（第 3 周练的就是这个）：
#   docker compose logs -f frontend                              # 看日志
#   docker compose exec frontend cat /etc/nginx/conf.d/default.conf  # 看配置
#   docker compose exec frontend wget -qO- http://backend:3000/api/health  # 测连通
#
# 关键点：proxy_pass 里的主机名是 `backend` —— 这是 docker-compose.yml 里
# 定义的服务名。Docker Compose 的内置 DNS 会把服务名解析成容器 IP，
# 所以容器之间可以直接用服务名互相访问，不需要写 IP。

server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    # 静态资源根目录（Dockerfile 里把构建产物 COPY 到这里）
    root   /usr/share/nginx/html;
    index  index.html;

    # ── 前端页面 ──
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── API 反向代理（本文件存在的唯一理由）──
    location /api {
        proxy_pass http://backend:3000;

        # 把原始请求的真实信息透传给后端，
        # 否则后端日志里看到的全是代理的 IP，出问题不好排查
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 后端如果慢，别让 Nginx 提前掐断（默认 60s）
        proxy_connect_timeout 30s;
        proxy_read_timeout    60s;
    }

    # 留一个 50x 页面位置，便于出问题时看到明确提示
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
