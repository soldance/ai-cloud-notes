name: CI/CD

on:
  push:
    branches: [develop, main]

env:
  NODE_VERSION: '20'

jobs:
  # ===== 阶段 1：跑测试 =====
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 后端测试
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install backend deps
        working-directory: ./backend
        run: npm ci

      - name: Run backend tests
        working-directory: ./backend
        run: npm test

      # 前端构建测试
      - name: Install frontend deps
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      # ===== E2E 测试（Playwright）=====
      #
      # 为什么必须有这一步？
      #   之前 CI 只跑 Jest + 前端构建，**E2E 测试只在本机跑**。
      #   后果：有人把 data-testid 改名、或改坏了前端交互，
      #        CI 依然全绿，坏代码照样合进 main —— E2E 白写了。
      #   补上这一步后，CI 才是真正的"守门人"。
      - name: Install E2E deps
        working-directory: ./tests-e2e
        run: npm ci

      # --with-deps 会顺便装 Chromium 需要的系统库（CI 上必需，本机装了也无害）
      - name: Install Playwright browsers
        working-directory: ./tests-e2e
        run: npx playwright install --with-deps chromium

      # E2E 需要真实的前后端在跑。下面两步用 `&` 丢到后台，
      # 所以**不能**用 `npm run dev`（nodemon 在前台不会返回，会卡住整个 job）。
      - name: Start backend
        run: |
          cd backend
          npm start &

      - name: Start frontend
        run: |
          cd frontend
          npm run dev -- --host 127.0.0.1 &

      # 等两个服务真正就绪再测，否则 Playwright 会连不上直接失败
      - name: Wait for services
        working-directory: ./tests-e2e
        run: npx wait-on http://localhost:3000/api/health http://localhost:5173 --timeout 90000

      - name: Run E2E tests
        working-directory: ./tests-e2e
        run: npx playwright test

      # 失败时把报告和截图传上来，方便排查（CI 里没有界面可看）
      - name: Upload E2E report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests-e2e/playwright-report/
          retention-days: 7

  # ===== 阶段 2：部署到服务器（仅 main 分支） =====
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to server via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "."
          target: "/root/ai-cloud-notes"

      - name: Restart Docker containers
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /root/ai-cloud-notes
            # 创建 .env 文件（敏感信息不进 Git）
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" > backend/.env
            # 重新构建并启动
            docker compose down
            docker compose up -d --build
            # 验证服务健康
            sleep 5
            curl -f http://localhost:3000/api/health || exit 1
            echo "✅ 部署成功，健康检查通过"
            # 打印最近日志供排查
            docker compose logs --tail=20
