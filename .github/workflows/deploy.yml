name: CI/CD

on:
  push:
    branches: [develop, main]

env:
  NODE_VERSION: '20'

jobs:
  # ===== 阶段 1：跑测试 =====
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 后端测试
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install backend deps
        working-directory: ./backend
        run: npm ci

      - name: Run backend tests
        working-directory: ./backend
        run: npm test

      # 前端构建测试
      - name: Install frontend deps
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

  # ===== 阶段 2：部署到服务器（仅 main 分支） =====
  #
  # ⚙️ 部署总开关：仓库变量 DEPLOY_ENABLED
  #   - 未配置 或 值为 false → 本 job 直接跳过（显示 ⏭️ skipped，不会失败报错）
  #   - 值为 true            → 正常执行 SSH 部署
  #
  # 为什么需要这个开关？
  #   没配服务器时，下方的 secrets.SERVER_IP 是空字符串，
  #   appleboy/scp-action 会因为拿不到 host 而报错，
  #   导致每次 push main 都收到一封"部署失败"的邮件 —— 但代码其实完全没问题。
  #
  # 🔴 第 4 周准备好服务器后，这样开启：
  #   1. 配好 4 个 Secret：SERVER_IP / SERVER_USER / SSH_PRIVATE_KEY / JWT_SECRET
  #   2. 到 Settings → Secrets and variables → Actions → Variables
  #      新建变量 DEPLOY_ENABLED = true
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to server via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "."
          target: "/root/ai-cloud-notes"

      - name: Restart Docker containers
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /root/ai-cloud-notes
            # 创建 .env 文件（敏感信息不进 Git）
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" > backend/.env
            # 重新构建并启动
            docker compose down
            docker compose up -d --build
            # 验证服务健康
            sleep 5
            curl -f http://localhost:3000/api/health || exit 1
            echo "✅ 部署成功，健康检查通过"
            # 打印最近日志供排查
            docker compose logs --tail=20
