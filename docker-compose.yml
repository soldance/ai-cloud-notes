version: '3.8'

services:
  backend:
    build: ./backend
    container_name: notes-backend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - DB_PATH=./data/notes.db
    volumes:
      - ./backend/data:/app/data   # 数据持久化（容器删了数据还在）
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: notes-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
